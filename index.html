<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>The BC Cargo &amp; Courier Pvt. Ltd. | National &amp; International Logistics</title>
    <meta name="description" content="National and International cargo, express courier, air freight charters, and customs clearance logistics headquartered in Hetauda, connecting Nepal with 220+ destinations." />
    <meta name="theme-color" content="#F6F6F4" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      // Light theme only: forget any old saved theme choice
      try { localStorage.removeItem('bc_cargo_theme'); } catch (e) {}
    </script>
  </head>
  <body class="antialiased selection:bg-[#F2B705] selection:text-[#002147]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function(err) {
            console.warn('[SW Registration]', err);
          });
        });
      }
    </script>
  </body>
