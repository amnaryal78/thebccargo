<!doctype html>
<html lang="en" class="bc-booting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>International Courier &amp; Cargo from Nepal | BC Cargo</title>
    <meta name="description" content="International courier and cargo from Hetauda, Nepal. Send parcels, documents and commercial cargo worldwide with live per-kg rates and online tracking." />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      // Light theme only: forget any old saved theme choice
      try { localStorage.removeItem('bc_cargo_theme'); } catch (e) {}
    </script>
    <style id="bc-shell-css">
      /* The prerendered text in #root is for crawlers and no-JS visitors; it stays hidden until React replaces it,
         so the swap never registers as layout shift. CSS-only safety net reveals it if scripts never run. */
      html.bc-booting #root{visibility:hidden;animation:bc-reveal 0s 30s forwards}
      @keyframes bc-reveal{to{visibility:visible}}
      @keyframes bc-giveup{to{visibility:hidden;pointer-events:none}}
      /* Skeleton of the site, shown only when the app takes over 500ms to start. React removes it on first commit. */
      #bc-shell{position:fixed;inset:0;z-index:50;overflow:hidden;background:#F6F6F4;opacity:0;
        animation:bc-shell-in .15s ease .5s forwards,bc-giveup 0s 30s forwards}
      @keyframes bc-shell-in{to{opacity:1}}
      .bc-shell__bar{height:64px;margin:12px 16px 0;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #E6E5DF;border-radius:16px}
      .bc-shell__bar img{display:block;height:40px;width:auto}
      .bc-shell__main{max-width:1280px;margin:0 auto;padding:48px 16px;display:grid;gap:16px}
      .bc-shell i{display:block;border-radius:8px;background:#E6E5DF;animation:bc-shell-pulse 1.6s ease-in-out infinite}
      @keyframes bc-shell-pulse{50%{opacity:.5}}
      .bc-shell__err{display:none;margin:0;font:16px/1.5 system-ui,sans-serif;color:#0B2D63}
      .bc-shell__err button{display:block;margin-top:12px;min-height:44px;padding:0 20px;font:inherit;font-weight:700;color:#fff;background:#0B2D63;border:0;border-radius:999px;cursor:pointer}
      .bc-shell__err button:focus-visible{outline:3px solid #F2B632;outline-offset:2px}
      #bc-shell[data-failed]{animation:none;opacity:1}
      #bc-shell[data-failed] .bc-shell__err{display:block}
      #bc-shell[data-failed] i{display:none}
      @media (prefers-reduced-motion:reduce){.bc-shell i{animation:none}}
    </style>
  </head>
  <body class="antialiased selection:bg-gd-500 selection:text-ox-900">
    <div id="root"></div>
    <div id="bc-shell" class="bc-shell" role="status" aria-label="Loading The BC Cargo">
      <div class="bc-shell__bar">
        <img src="/brand/bc-logo-96.webp" srcset="/brand/bc-logo-96.webp 96w, /brand/bc-logo-128.webp 128w, /brand/bc-logo-192.webp 192w" sizes="62px" width="62" height="40" alt="" decoding="async" draggable="false" />
        <i style="width:96px;height:36px;border-radius:999px"></i>
      </div>
      <div class="bc-shell__main">
        <i style="height:44px;width:min(560px,90%)"></i>
        <i style="height:18px;width:min(420px,75%)"></i>
        <i style="height:260px;margin-top:16px;border-radius:16px"></i>
        <p class="bc-shell__err">This page did not load. Check your connection, then reload.<button type="button" data-shell-reload>Reload page</button></p>
      </div>
    </div>
    <noscript><style>#bc-shell{display:none!important}html.bc-booting #root{visibility:visible!important}</style></noscript>
    <script>
      // If the app never takes over (script blocked, offline, dropped), say so instead of showing placeholders forever.
      (function () {
        function fail() { var s = document.getElementById('bc-shell'); if (s) s.setAttribute('data-failed', ''); }
        window.__bcShellFail = fail;
        setTimeout(fail, 15000);
        // Resource errors do not bubble, so listen in the capture phase for the entry script failing to load.
        window.addEventListener('error', function (e) { if (e.target && e.target.tagName === 'SCRIPT') fail(); }, true);
        document.addEventListener('click', function (e) {
          if (e.target && e.target.closest && e.target.closest('[data-shell-reload]')) location.reload();
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function(err) {
            console.warn('[SW Registration]', err);
          });
        });
      }
    </script>
  </body>
</html>
