<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>The BC Cargo &amp; Courier Pvt. Ltd. | National &amp; International Logistics</title>
    <meta name="description" content="National and International cargo, express courier, air freight charters, and customs clearance logistics headquartered in Hetauda, connecting Nepal with 220+ destinations." />
    <meta name="theme-color" content="#F6F6F4" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      // Light theme only: forget any old saved theme choice
      try { localStorage.removeItem('bc_cargo_theme'); } catch (e) {}
    </script>
    <style id="bc-boot-css">
      /* BC Cargo boot loader. Painted from the first HTML byte; src/boot/bootLoader.ts reports real progress.
         Only transform/opacity are animated. Brand: Oxford #002147, golden yellow #F2B705, base #F6F6F4. */
      #bc-boot{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;
        background:#F6F6F4 radial-gradient(60% 46% at 50% 40%,rgba(242,183,5,.11),transparent 70%);
        color:#002147;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
        --i:0;--bc-p:0;--cx:0px;--tx:-120px;--truck:0;--bx:0px;--by:0px;--sh:.22;--sig:0;--ok:0;
        /* Invisible for the first 150ms so a fast page never flashes it. */
        animation:bc-in .4s ease .15s backwards;transition:opacity .5s ease,transform .5s cubic-bezier(.2,.8,.2,1)}
      #bc-boot.is-leaving{opacity:0;transform:scale(1.015);pointer-events:none}
      #bc-boot[data-stage=loading]{--i:1;--tx:43px;--truck:1;--by:-12px;--sh:.12}
      #bc-boot[data-stage=transit]{--i:2;--tx:43px;--truck:1;--by:-12px;--sh:.12;--cx:120px}
      #bc-boot[data-stage=network]{--i:3;--tx:200px;--truck:0;--cx:120px;--bx:60px;--by:-26px;--sh:.12;--sig:1}
      #bc-boot[data-stage=ready]{--i:4;--tx:200px;--truck:0;--cx:120px;--bx:120px;--by:0px;--sh:.22;--ok:1}
      @keyframes bc-in{from{opacity:0}}
      .bc-boot__in{width:min(88vw,400px);display:flex;flex-direction:column;align-items:center;gap:14px;padding-bottom:3vh;
        transition:transform .5s cubic-bezier(.2,.8,.2,1)}
      #bc-boot.is-leaving .bc-boot__in{transform:translateY(-8px)}
      .bc-boot__logo{display:block;height:38px;width:auto;opacity:.95}
      .bc-boot__scene{width:100%;height:auto;display:block;overflow:visible}
      /* world: parallax skyline + road */
      .bc-far,.bc-mid,.bc-dash{will-change:transform;animation-play-state:paused}
      .bc-far{animation:bc-slide 41s linear infinite}
      .bc-mid{animation:bc-slide 23s linear infinite}
      .bc-dash{animation:bc-dashes .55s linear infinite}
      #bc-boot[data-stage=transit] :is(.bc-far,.bc-mid,.bc-dash,.bc-wh),
      #bc-boot[data-stage=loading] .bc-wh{animation-play-state:running}
      @keyframes bc-slide{to{transform:translateX(-320px)}}
      @keyframes bc-dashes{to{transform:translateX(-24px)}}
      @keyframes bc-spin{to{transform:rotate(360deg)}}
      .bc-wh{animation:bc-spin .6s linear infinite;animation-play-state:paused}
      /* carrier: group shifts between route nodes, truck drives in/out, box hops */
      .bc-car{transform:translateX(var(--cx));transition:transform 1.5s cubic-bezier(.65,0,.35,1)}
      .bc-truck{transform:translate(var(--tx),104px);opacity:var(--truck);
        transition:transform 1.05s cubic-bezier(.2,.8,.2,1),opacity .45s ease}
      .bc-box{transform:translate(calc(40px + var(--bx)),calc(104px + var(--by)));
        transition:transform .75s cubic-bezier(.34,1.45,.64,1)}
      .bc-bob{animation:bc-bob 2.6s ease-in-out infinite}
      @keyframes bc-bob{50%{transform:translateY(-1.5px)}}
      .bc-tape{stroke-dasharray:24;animation:bc-tape .8s ease .1s backwards}
      @keyframes bc-tape{from{stroke-dashoffset:24}}
      .bc-shadow{transform:translateX(calc(40px + var(--bx)));opacity:var(--sh);transition:transform .75s cubic-bezier(.34,1.45,.64,1),opacity .5s ease}
      .bc-sig{opacity:var(--sig);transition:opacity .4s ease}
      .bc-sig circle{transform-box:fill-box;transform-origin:center;animation:bc-ring 1.8s ease-out infinite}
      .bc-sig circle:nth-child(2){animation-delay:.6s}.bc-sig circle:nth-child(3){animation-delay:1.2s}
      @keyframes bc-ring{from{transform:scale(.5);opacity:.7}to{transform:scale(2.8);opacity:0}}
      .bc-ok{transform:scale(var(--ok));transform-box:fill-box;transform-origin:center;transition:transform .55s cubic-bezier(.34,1.7,.64,1) .15s}
      /* route line + nodes: each node reads --i against its own --k */
      .bc-route-done{stroke-dasharray:240px;stroke-dashoffset:calc(240px * (1 - var(--i) / 4));transition:stroke-dashoffset 1.2s cubic-bezier(.65,0,.35,1)}
      .bc-nd-on{opacity:clamp(0, calc(var(--i) - var(--k) + 1), 1);transition:opacity .5s ease}
      .bc-nd-now{opacity:clamp(0, calc(1 - (var(--i) - var(--k)) * (var(--i) - var(--k))), 1);transition:opacity .5s ease}
      .bc-nd-now circle{transform-box:fill-box;transform-origin:center;animation:bc-pulse 1.6s ease-in-out infinite}
      @keyframes bc-pulse{50%{transform:scale(1.35);opacity:.35}}
      /* status text: finished stages drift up and fade, the next one rises in */
      .bc-boot__text{display:grid;justify-items:center;text-align:center;min-height:50px}
      .bc-boot__text>span{grid-area:1/1;display:flex;flex-direction:column;gap:3px;
        opacity:clamp(0, calc(1 - (var(--i) - var(--k)) * (var(--i) - var(--k))), 1);
        transform:translateY(calc((var(--k) - var(--i)) * 10px));
        transition:opacity .45s ease,transform .55s cubic-bezier(.2,.8,.2,1)}
      .bc-boot__text b{font-size:clamp(20px,5.2vw,26px);font-weight:800;letter-spacing:-.01em;line-height:1.1}
      .bc-boot__text small{font-size:12.5px;color:#474642;letter-spacing:.01em}
      .bc-boot__rail{list-style:none;margin:0;padding:0;width:100%;display:flex;justify-content:space-between;gap:4px}
      .bc-boot__rail li{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;
        opacity:calc(.5 + .5 * clamp(0, 1 - (var(--i) - var(--k)) * (var(--i) - var(--k)), 1));transition:opacity .45s ease}
      .bc-boot__rail i{position:relative;width:9px;height:9px;border-radius:50%;border:2px solid #B9B8B0;box-sizing:border-box}
      .bc-boot__rail i::after{content:"";position:absolute;inset:-2px;border-radius:50%;background:#002147;
        opacity:clamp(0, calc(var(--i) - var(--k) + 1), 1);transform:scale(clamp(.6, calc(1.6 - (var(--i) - var(--k)) * .4), 1.25));
        transition:opacity .45s ease,transform .5s cubic-bezier(.34,1.5,.64,1)}
      .bc-boot__rail span{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#474642;white-space:nowrap}
      .bc-boot__bar{width:100%;height:3px;border-radius:3px;background:#D9D8D2;overflow:hidden}
      .bc-boot__bar i{display:block;height:100%;transform-origin:0 50%;transform:scaleX(var(--bc-p));will-change:transform;
        background:linear-gradient(90deg,#002147,#F2B705);transition:transform .2s linear}
      .bc-boot__slow{margin:0;min-height:62px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:14px;color:#474642;
        opacity:0;transform:translateY(4px);transition:opacity .5s ease,transform .5s ease;pointer-events:none}
      #bc-boot:is([data-slow="1"],[data-slow="2"]) .bc-boot__slow{opacity:1;transform:none}
      .bc-boot__act{display:none;gap:8px;align-items:center}
      #bc-boot[data-slow="2"] .bc-boot__act{display:flex;pointer-events:auto}
      .bc-boot__act button{font:inherit;font-weight:700;font-size:13px;min-height:40px;padding:0 18px;border-radius:999px;cursor:pointer;
        border:2px solid #002147;background:#002147;color:#F6F6F4}
      .bc-boot__act button+button{background:transparent;color:#002147}
      .bc-boot__act button:focus-visible{outline:3px solid #F2B705;outline-offset:2px}
      .bc-sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
      @media (max-width:419px){.bc-boot__rail span{display:none}.bc-boot__logo{height:32px}}
      @media (max-height:520px){.bc-boot__in{gap:8px}.bc-boot__logo{display:none}}
      /* Reduced motion: no travel or loops, only soft cross-fades between stages. */
      @media (prefers-reduced-motion:reduce){
        #bc-boot *{animation:none!important}
        .bc-car,.bc-truck,.bc-box,.bc-shadow,.bc-ok,.bc-route-done,.bc-boot__text>span,.bc-boot__bar i{transition:opacity .3s ease!important}
        #bc-boot.is-leaving,#bc-boot.is-leaving .bc-boot__in{transform:none}
      }
    </style>
  </head>
  <body class="antialiased selection:bg-[#F2B705] selection:text-[#002147]">
    <div id="root"></div>
    <div id="bc-boot" data-stage="preparing" data-slow="0">
      <div class="bc-boot__in">
        <img class="bc-boot__logo" src="/brand/bc-logo.webp" width="62" height="40" alt="" decoding="async" draggable="false" />
        <svg class="bc-boot__scene" viewBox="0 0 320 140" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="bc-gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD24A"/><stop offset="1" stop-color="#F2B705"/></linearGradient>
            <g id="bc-sky"><path fill="#ECEBE7" d="M0 104V84Q30 62 70 80T140 76T210 84T280 70T320 84V104Z"/></g>
            <g id="bc-city" fill="#E2E1DC"><rect x="10" y="78" width="18" height="26"/><rect x="34" y="68" width="14" height="36"/><rect x="56" y="84" width="20" height="20"/><rect x="90" y="74" width="16" height="30"/><rect x="118" y="86" width="22" height="18"/><rect x="150" y="64" width="15" height="40"/><rect x="176" y="80" width="20" height="24"/><rect x="206" y="72" width="14" height="32"/><rect x="232" y="86" width="18" height="18"/><rect x="262" y="70" width="16" height="34"/><rect x="288" y="82" width="22" height="22"/></g>
          </defs>
          <g class="bc-far"><use href="#bc-sky"/><use href="#bc-sky" x="320"/></g>
          <g class="bc-mid"><use href="#bc-city"/><use href="#bc-city" x="320"/></g>
          <rect x="0" y="104" width="320" height="22" fill="#ECEBE7" opacity=".7"/>
          <line x1="0" y1="104" x2="320" y2="104" stroke="#D9D8D2" stroke-width="2"/>
          <g class="bc-dash" fill="#D9D8D2"><rect x="0" y="112" width="10" height="2" rx="1"/><rect x="24" y="112" width="10" height="2" rx="1"/><rect x="48" y="112" width="10" height="2" rx="1"/><rect x="72" y="112" width="10" height="2" rx="1"/><rect x="96" y="112" width="10" height="2" rx="1"/><rect x="120" y="112" width="10" height="2" rx="1"/><rect x="144" y="112" width="10" height="2" rx="1"/><rect x="168" y="112" width="10" height="2" rx="1"/><rect x="192" y="112" width="10" height="2" rx="1"/><rect x="216" y="112" width="10" height="2" rx="1"/><rect x="240" y="112" width="10" height="2" rx="1"/><rect x="264" y="112" width="10" height="2" rx="1"/><rect x="288" y="112" width="10" height="2" rx="1"/><rect x="312" y="112" width="10" height="2" rx="1"/></g>
          <line x1="40" y1="130" x2="280" y2="130" stroke="#D9D8D2" stroke-width="2" stroke-linecap="round"/>
          <line class="bc-route-done" x1="40" y1="130" x2="280" y2="130" stroke="#002147" stroke-width="2" stroke-linecap="round"/>
          <g>
            <g style="--k:0"><circle cx="40" cy="130" r="5" fill="#fff" stroke="#B9B8B0" stroke-width="1.5"/><g class="bc-nd-on"><circle cx="40" cy="130" r="5" fill="#F2B705" stroke="#002147" stroke-width="1.5"/></g><g class="bc-nd-now"><circle cx="40" cy="130" r="9" fill="none" stroke="#F2B705" stroke-width="1.5"/></g></g>
            <g style="--k:1"><circle cx="100" cy="130" r="5" fill="#fff" stroke="#B9B8B0" stroke-width="1.5"/><g class="bc-nd-on"><circle cx="100" cy="130" r="5" fill="#F2B705" stroke="#002147" stroke-width="1.5"/></g><g class="bc-nd-now"><circle cx="100" cy="130" r="9" fill="none" stroke="#F2B705" stroke-width="1.5"/></g></g>
            <g style="--k:2"><circle cx="160" cy="130" r="5" fill="#fff" stroke="#B9B8B0" stroke-width="1.5"/><g class="bc-nd-on"><circle cx="160" cy="130" r="5" fill="#F2B705" stroke="#002147" stroke-width="1.5"/></g><g class="bc-nd-now"><circle cx="160" cy="130" r="9" fill="none" stroke="#F2B705" stroke-width="1.5"/></g></g>
            <g style="--k:3"><circle cx="220" cy="130" r="5" fill="#fff" stroke="#B9B8B0" stroke-width="1.5"/><g class="bc-nd-on"><circle cx="220" cy="130" r="5" fill="#F2B705" stroke="#002147" stroke-width="1.5"/></g><g class="bc-nd-now"><circle cx="220" cy="130" r="9" fill="none" stroke="#F2B705" stroke-width="1.5"/></g></g>
            <g style="--k:4"><circle cx="280" cy="130" r="5" fill="#fff" stroke="#B9B8B0" stroke-width="1.5"/><g class="bc-nd-on"><circle cx="280" cy="130" r="5" fill="#F2B705" stroke="#002147" stroke-width="1.5"/></g><g class="bc-nd-now"><circle cx="280" cy="130" r="9" fill="none" stroke="#F2B705" stroke-width="1.5"/></g></g>
          </g>
          <g class="bc-car">
            <ellipse class="bc-shadow" cx="0" cy="106" rx="14" ry="2.6" fill="#002147"/>
            <g class="bc-truck">
              <rect x="-30" y="-13" width="54" height="5" rx="2" fill="#002147"/>
              <path d="M26 -9V-27a4 4 0 0 1 4-4h9a4 4 0 0 1 3.2 1.6L49 -21v12Z" fill="#002147"/>
              <path d="M32 -27h6l4.6 6H32Z" fill="#ECEBE7"/>
              <rect x="44" y="-13" width="6" height="4" rx="1" fill="#F2B705"/>
              <g fill="#121211"><circle cx="-18" cy="-6" r="6"/><circle cx="6" cy="-6" r="6"/><circle cx="38" cy="-6" r="6"/></g>
              <g class="bc-wh" style="transform-origin:-18px -6px" fill="#F2B705"><circle cx="-18" cy="-8.6" r="1.6"/></g>
              <g class="bc-wh" style="transform-origin:6px -6px" fill="#F2B705"><circle cx="6" cy="-8.6" r="1.6"/></g>
              <g class="bc-wh" style="transform-origin:38px -6px" fill="#F2B705"><circle cx="38" cy="-8.6" r="1.6"/></g>
            </g>
            <g class="bc-box">
              <g class="bc-sig" fill="none" stroke="#F2B705" stroke-width="1.5"><circle cx="0" cy="-10" r="12"/><circle cx="0" cy="-10" r="12"/><circle cx="0" cy="-10" r="12"/></g>
              <g class="bc-bob">
                <rect x="-11" y="-20" width="22" height="20" rx="4" fill="url(#bc-gd)"/>
                <path d="M-9.5 -2.2V-16a3 3 0 0 1 3-3H8" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.2" stroke-linecap="round"/>
                <path d="M-11 -4.5H11" stroke="#B98A00" stroke-opacity=".35" stroke-width="1.2"/>
                <path class="bc-tape" d="M0 -20V0" stroke="#002147" stroke-width="3.4"/>
                <rect x="3.6" y="-9" width="5.6" height="4.4" rx="1" fill="#fff" fill-opacity=".9"/>
                <g class="bc-ok"><circle cx="11" cy="-21" r="7" fill="#002147" stroke="#F6F6F4" stroke-width="1.5"/><path d="M7.6 -21.2l2.4 2.4 4.2-4.6" fill="none" stroke="#F2B705" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
              </g>
            </g>
          </g>
        </svg>
        <div class="bc-boot__text" aria-hidden="true">
          <span style="--k:0"><b>Preparing</b><small>Packing your page</small></span>
          <span style="--k:1"><b>Loading</b><small>Loading the cargo</small></span>
          <span style="--k:2"><b>In Transit</b><small>Moving through the network</small></span>
          <span style="--k:3"><b>Connecting to Network</b><small>Syncing rates, tracking and services</small></span>
          <span style="--k:4"><b>Ready</b><small>Delivered</small></span>
        </div>
        <ol class="bc-boot__rail" aria-hidden="true">
          <li style="--k:0"><i></i><span>Preparing</span></li>
          <li style="--k:1"><i></i><span>Loading</span></li>
          <li style="--k:2"><i></i><span>In Transit</span></li>
          <li style="--k:3"><i></i><span>Network</span></li>
          <li style="--k:4"><i></i><span>Ready</span></li>
        </ol>
        <div class="bc-boot__bar" aria-hidden="true"><i></i></div>
        <p class="bc-boot__slow">
          <span>Taking longer than expected…</span>
          <span class="bc-boot__act"><button type="button" data-boot-reload>Reload</button><button type="button" data-boot-continue>Continue anyway</button></span>
        </p>
        <span class="bc-sr" id="bc-boot-sr" role="status" aria-live="polite">Loading The BC Cargo: Preparing</span>
      </div>
    </div>
    <noscript><style>#bc-boot{display:none!important}</style></noscript>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function(err) {
            console.warn('[SW Registration]', err);
          });
        });
      }
    </script>
  </body>
</html>
