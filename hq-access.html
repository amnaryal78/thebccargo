<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HQ Access — The BC Cargo</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #1a56db;
      --primary-light: #3b82f6;
      --primary-glow: rgba(26, 86, 219, 0.25);
      --accent-gold: #f5a623;
      --bg-deep: #060b1e;
      --bg-card: rgba(12, 18, 44, 0.85);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --gradient-primary: linear-gradient(135deg, #1a56db 0%, #06b6d4 100%);
      --font-sans: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
      --radius: 16px;
    }

    html,
    body {
      height: 100%;
      font-family: var(--font-sans);
      background: var(--bg-deep);
      color: var(--text-primary);
      overflow: hidden;
    }

    /* Animated background */
    .bg-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .bg-scene::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 40%, rgba(26, 86, 219, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 70% 60%, rgba(6, 182, 212, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 50% 80%, rgba(245, 166, 35, 0.05) 0%, transparent 40%);
      animation: bgShift 20s ease-in-out infinite alternate;
    }

    @keyframes bgShift {
      0% {
        transform: translate(0, 0) rotate(0deg);
      }

      100% {
        transform: translate(-3%, -3%) rotate(3deg);
      }
    }

    /* Grid pattern */
    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* Login container */
    .login-container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding: 2.5rem 2rem;
      box-shadow: 0 32px 64px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.03);
      animation: cardFadeIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes cardFadeIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Brand */
    .brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 1rem;
      border-radius: 14px;
      background: var(--gradient-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px var(--primary-glow);
    }

    .brand-logo i {
      font-size: 1.5rem;
      color: #fff;
    }

    .brand h1 {
      font-size: 1.5rem;
      font-weight: 800;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
    }

    .brand p {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 0.35rem;
    }

    /* Form */
    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.9rem;
      color: var(--text-secondary);
      transition: color 0.2s;
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      padding: 0.85rem 0.85rem 0.85rem 2.7rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
    }

    .form-input::placeholder {
      color: rgba(148, 163, 184, 0.5);
    }

    .form-input:focus {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px var(--primary-glow);
      background: rgba(255, 255, 255, 0.06);
    }

    .form-input:focus+i,
    .input-wrap:focus-within i {
      color: var(--primary-light);
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.9rem;
      padding: 4px;
      transition: color 0.2s;
    }

    .toggle-password:hover {
      color: var(--text-primary);
    }

    /* Submit button */
    .btn-login {
      width: 100%;
      padding: 0.9rem;
      border: none;
      border-radius: 10px;
      background: var(--gradient-primary);
      color: #fff;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: transform 0.15s, box-shadow 0.25s, opacity 0.2s;
      box-shadow: 0 4px 16px var(--primary-glow);
      margin-top: 0.5rem;
    }

    .btn-login:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px var(--primary-glow);
    }

    .btn-login:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Error message */
    .error-msg {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 8px;
      padding: 0.7rem 0.9rem;
      font-size: 0.82rem;
      color: #fca5a5;
      margin-bottom: 1rem;
      display: none;
      align-items: center;
      gap: 0.5rem;
      animation: shakeError 0.4s ease;
    }

    .error-msg.show {
      display: flex;
    }

    @keyframes shakeError {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-6px);
      }

      75% {
        transform: translateX(6px);
      }
    }

    /* Footer */
    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: rgba(148, 163, 184, 0.4);
    }

    /* Responsive */
    @media (max-width: 480px) {
      .login-card {
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>

<body>
  <div class="bg-scene"></div>
  <div class="bg-grid"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="brand">
        <div class="brand-logo">
          <i class="fas fa-shield-alt"></i>
        </div>
        <h1>HQ Access</h1>
        <p>The BC Cargo — Admin Portal</p>
      </div>

      <div class="error-msg" id="errorMsg">
        <i class="fas fa-exclamation-circle"></i>
        <span id="errorText"></span>
      </div>

      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-wrap">
            <input type="text" class="form-input" id="username" name="username" placeholder="Enter username" required
              autofocus>
            <i class="fas fa-user"></i>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrap">
            <input type="password" class="form-input" id="password" name="password" placeholder="Enter password"
              required>
            <i class="fas fa-lock"></i>
            <button type="button" class="toggle-password" id="togglePwd" aria-label="Toggle password visibility">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <i class="fas fa-sign-in-alt"></i>
          <span>Sign In</span>
        </button>
      </form>

      <div class="login-footer">
        &copy; 2026 The BC Cargo &mdash; Authorized Personnel Only
      </div>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/hq-access.js" defer></script>
</body>

</html>
